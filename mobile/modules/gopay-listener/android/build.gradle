plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  // kapt ikut dalam kotlin-gradle-plugin yang sudah ada di classpath root.
  // KSP tidak — memakainya menuntut suntikan ke buildscript root lewat config
  // plugin, mesin tambahan yang tidak sepadan untuk satu annotation processor.
  id 'org.jetbrains.kotlin.kapt'
}

group = 'id.manjo.gopaybridge'
version = '1.0.0'

android {
  namespace 'expo.modules.gopaylistener'

  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  // Room 2.8.x wajib, bukan 2.6.x. Compiler 2.6.1 hanya memahami metadata
  // Kotlin sampai 2.0.0, sementara project ini memakai Kotlin 2.1.20 yang
  // menghasilkan metadata 2.1.0 — kapt gagal dengan
  // "Provided Metadata instance has version 2.1.0, while maximum supported
  // version is 2.0.0". Jangan turunkan versinya.
  implementation 'androidx.room:room-runtime:2.8.5'
  implementation 'androidx.room:room-ktx:2.8.5'
  kapt 'androidx.room:room-compiler:2.8.5'

  // 1.1.0 (stabil) memakai MasterKey.Builder; 1.0.0 memakai MasterKeys yang
  // sudah usang. Tanda tangan EncryptedSharedPreferences.create juga berbeda
  // antara keduanya.
  implementation 'androidx.security:security-crypto:1.1.0'

  implementation 'androidx.work:work-runtime-ktx:2.11.2'
  // OkHttp 4.x, bukan 5.x. API 5 mengubah bentuk response.body dan memindahkan
  // mockwebserver ke paket baru; 4.12.0 sudah cukup dan jauh lebih dikenal.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  testImplementation 'junit:junit:4.13.2'
  // Room butuh runtime Android; Robolectric menyediakannya di JVM sehingga
  // test DAO tidak memerlukan emulator atau perangkat.
  testImplementation 'org.robolectric:robolectric:4.14.1'
  testImplementation 'androidx.test:core:1.6.1'
  // Menguji bentuk request yang benar-benar dikirim — header dan byte body —
  // tanpa menyentuh jaringan sungguhan.
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
