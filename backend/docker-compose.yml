services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gopay
      POSTGRES_PASSWORD: gopay
      POSTGRES_DB: gopay_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopay"]
      interval: 2s
      timeout: 3s
      retries: 15
